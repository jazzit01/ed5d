<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b1120" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Action Matrix Spoken Drill</title>
  
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./favn.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icon.png" />
  <link rel="apple-touch-icon" href="./icon.png" />
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>

  <style>
    /* CSS Variables for Dynamic Theme Switching */
    :root {
      --bg-main: #0b1120;
      --bg-header: #131d31;
      --border-color: #1e293b;
      --card-bg: #131d31;
      --text-main: #ffffff;
      --text-sub: #64748b;
      --pill-bg: #1e293b;
      --pill-border: #334155;
      --pill-text: #94a3b8;
      --accent-blue: #0284c7;
      --accent-cyan: #38bdf8;
      --timer-bg: rgba(2, 132, 199, 0.12);
      --timer-text: #38bdf8;
    }

    [data-theme="light"] {
      --bg-main: #f1f5f9;
      --bg-header: #ffffff;
      --border-color: #cbd5e1;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --pill-bg: #f8fafc;
      --pill-border: #cbd5e1;
      --pill-text: #475569;
      --accent-blue: #0284c7;
      --accent-cyan: #0284c7;
      --timer-bg: rgba(2, 132, 199, 0.08);
      --timer-text: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    body {
      background: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Top Navigation Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
    }
    .select-wrapper { position: relative; }
    .day-selector {
      appearance: none;
      -webkit-appearance: none;
      background: var(--pill-bg);
      color: var(--accent-cyan);
      border: 1px solid var(--pill-border);
      padding: 8px 30px 8px 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      outline: none;
    }
    .arrow-icon {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--accent-cyan);
      font-size: 10px;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Editable Counter Pill */
    .counter-pill {
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      padding: 4px 8px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--pill-text);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .counter-input {
      background: var(--bg-main);
      color: var(--accent-cyan);
      border: 1px solid var(--pill-border);
      border-radius: 6px;
      width: 44px;
      height: 26px;
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      outline: none;
      user-select: text;
    }
    .counter-input::-webkit-outer-spin-button,
    .counter-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* Header Action Buttons */
    .btn-header {
      background: var(--pill-bg);
      color: var(--pill-text);
      border: 1px solid var(--pill-border);
      height: 34px;
      padding: 0 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Verb Badge & Stage Header */
    .verb-section {
      padding: 12px 20px 0 20px;
      text-align: center;
    }
    .verb-badge {
      display: inline-block;
      background: var(--accent-blue);
      color: #ffffff;
      padding: 6px 20px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
    }
    .verb-subtext {
      margin-top: 5px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
    }

    /* Central Sentence Display Area */
    .center-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
    }
    .sentence-card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 38px 22px 30px 22px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 600px;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Tiny Center-Top Countdown Display */
    .card-timer {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--timer-bg);
      color: var(--timer-text);
      border: 1px solid var(--border-color);
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      font-variant-numeric: tabular-nums;
      display: none;
    }

    .sentence-text {
      font-size: 25px;
      line-height: 1.5;
      font-weight: 700;
      color: var(--text-main);
      word-break: break-word;
    }

    /* Bottom Control Bar */
    .bottom-bar {
      display: flex;
      gap: 10px;
      padding: 12px 16px 18px 16px;
      background: var(--bg-header);
      border-top: 1px solid var(--border-color);
    }
    .ctrl-btn {
      height: 54px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.1s ease;
    }
    .ctrl-btn:active {
      transform: scale(0.96);
      opacity: 0.9;
    }

    /* Symmetrical Navigation Buttons (Prev & Next Match in Accent Blue) */
    .btn-nav {
      flex: 1;
      background: var(--accent-blue);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
    }

    .btn-play {
      flex: 1.2;
      background: #10b981;
      color: #ffffff;
      font-size: 18px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }
    .btn-auto {
      flex: 1.3;
      background: var(--pill-bg);
      color: var(--text-main);
      border: 1px solid var(--pill-border);
    }
    .btn-auto.active {
      background: #e11d48;
      color: #ffffff;
      border-color: #f43f5e;
      box-shadow: 0 4px 16px rgba(225, 29, 72, 0.4);
    }

    #fileInput { display: none; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="select-wrapper">
      <select id="daySelect" class="day-selector" onchange="onDayChange()">
        <option value="Day 1">Day 1</option>
        <option value="Day 2">Day 2</option>
        <option value="Day 3">Day 3</option>
        <option value="Day 4">Day 4</option>
        <option value="Day 5">Day 5</option>
      </select>
      <span class="arrow-icon">▼</span>
    </div>

    <div class="top-actions">
      <!-- Direct Jump Counter -->
      <div class="counter-pill">
        <input 
          type="number" 
          id="numInput" 
          class="counter-input" 
          min="1" 
          value="1" 
          onchange="jumpTo(this.value)"
          onkeydown="if(event.key==='Enter') this.blur();"
        />
        <span>/ <span id="totalBox">230</span></span>
      </div>

      <!-- Theme Toggle (Moon / Sun) -->
      <button class="btn-header" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Theme">🌙</button>

      <!-- Import CSV -->
      <button class="btn-header" onclick="document.getElementById('fileInput').click()">📁 CSV</button>
      <input type="file" id="fileInput" accept=".csv,.tsv,.txt" onchange="handleFileImport(event)" />
    </div>
  </div>

  <!-- Verb Banner -->
  <div class="verb-section">
    <div class="verb-badge" id="verbBox">ACTION</div>
    <div class="verb-subtext" id="metaBox">Tap '📁 CSV' to load exported sheet</div>
  </div>

  <!-- Big Central Sentence Card -->
  <div class="center-stage">
    <div class="sentence-card" id="cardArea">
      <!-- Tiny Center-Top Countdown Display -->
      <div class="card-timer" id="cardTimer">00:05</div>

      <div class="sentence-text" id="sentenceBox">
        "Tap the '📁 CSV' button to load your exported sheet file."
      </div>
    </div>
  </div>

  <!-- Bottom 4 Control Buttons -->
  <div class="bottom-bar">
    <button class="ctrl-btn btn-nav" onclick="handleManualPrev()">◄ Prev</button>
    <button class="ctrl-btn btn-play" onclick="speakCurrent()">▶ Play</button>
    <button class="ctrl-btn btn-auto" id="autoBtn" onclick="toggleAutoPlay()">⏱ Auto</button>
    <button class="ctrl-btn btn-nav" onclick="handleManualNext()">Next ►</button>
  </div>

  <script>
    let masterData = [];

    try {
      const saved = localStorage.getItem('user_matrix_drill_data');
      if (saved) {
        masterData = JSON.parse(saved);
      }
    } catch(e) {}

    let activeList = [];
    let curIndex = 0;

    // Auto Play States
    let isAutoPlaying = false;
    let autoTimer = null;
    let countdownInterval = null;
    let wakeLock = null;
    const BREAK_DURATION = 5; // 5-second interval

    // --- Theme Controller ---
    function initTheme() {
      const savedTheme = localStorage.getItem('app_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeButtonIcon(savedTheme);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('app_theme', next);
      updateThemeButtonIcon(next);
    }

    function updateThemeButtonIcon(theme) {
      const btn = document.getElementById('themeToggleBtn');
      btn.innerText = theme === 'dark' ? '🌙' : '☀️';
      const metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) {
        metaTheme.setAttribute('content', theme === 'dark' ? '#0b1120' : '#f1f5f9');
      }
    }

    initTheme();

    // --- Data Rendering ---
    function loadDay(dayName) {
      if (!masterData || masterData.length === 0) return;

      activeList = masterData.filter(item => item.day.toLowerCase().trim() === dayName.toLowerCase().trim());
      if (activeList.length === 0) {
        activeList = masterData.filter(item => item.day.includes(dayName.replace('Day ', '').trim()));
      }

      const savedIdx = localStorage.getItem('last_index_' + dayName);
      if (savedIdx !== null && Number(savedIdx) < activeList.length) {
        curIndex = Number(savedIdx);
      } else {
        curIndex = 0;
      }
      render();
    }

    function render() {
      if (activeList.length === 0) return;
      const item = activeList[curIndex];

      document.getElementById('verbBox').innerText = item.verb || "VERB";
      document.getElementById('metaBox').innerText = `${item.stage || ''} ${item.type ? '• [' + item.type + ']' : ''}`;
      document.getElementById('sentenceBox').innerText = `"${item.sentence}"`;

      const inputEl = document.getElementById('numInput');
      inputEl.value = curIndex + 1;
      inputEl.max = activeList.length;
      document.getElementById('totalBox').innerText = activeList.length;

      const day = document.getElementById('daySelect').value;
      localStorage.setItem('last_index_' + day, curIndex);
      localStorage.setItem('last_day', day);
    }

    function jumpTo(val) {
      stopAutoPlay();
      let target = parseInt(val, 10);
      if (isNaN(target)) target = 1;
      if (target < 1) target = 1;
      if (target > activeList.length) target = activeList.length;
      curIndex = target - 1;
      render();
    }

    function goNext() {
      if (curIndex < activeList.length - 1) {
        curIndex++;
        render();
        return true;
      }
      return false;
    }

    function goPrev() {
      if (curIndex > 0) {
        curIndex--;
        render();
        return true;
      }
      return false;
    }

    function handleManualNext() {
      stopAutoPlay();
      goNext();
    }

    function handleManualPrev() {
      stopAutoPlay();
      goPrev();
    }

    function onDayChange() {
      stopAutoPlay();
      const sel = document.getElementById('daySelect').value;
      loadDay(sel);
    }

    // TTS Audio Player
    function speakCurrent(onCompleteCallback) {
      if (!('speechSynthesis' in window)) {
        alert("Text-to-speech not supported on this browser.");
        return;
      }
      if (activeList.length === 0) return;

      window.speechSynthesis.cancel();
      const item = activeList[curIndex];
      const utter = new SpeechSynthesisUtterance(item.sentence);
      utter.lang = 'en-US';
      utter.rate = 0.92;
      utter.pitch = 1.0;

      if (onCompleteCallback) {
        utter.onend = () => { onCompleteCallback(); };
        utter.onerror = () => { onCompleteCallback(); };
      }

      window.speechSynthesis.speak(utter);
    }

    // --- Auto-Play & Tiny 00:30 Timer System ---
    async function toggleAutoPlay() {
      if (isAutoPlaying) {
        stopAutoPlay();
      } else {
        startAutoPlay();
      }
    }

    async function startAutoPlay() {
      isAutoPlaying = true;
      const btn = document.getElementById('autoBtn');
      btn.innerText = "⏹ Stop";
      btn.classList.add('active');

      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}

      runAutoCycle();
    }

    function stopAutoPlay() {
      isAutoPlaying = false;
      clearTimeout(autoTimer);
      clearInterval(countdownInterval);

      const timerEl = document.getElementById('cardTimer');
      timerEl.style.display = "none";

      const btn = document.getElementById('autoBtn');
      btn.innerText = "⏱ Auto";
      btn.classList.remove('active');

      if (wakeLock) {
        wakeLock.release().then(() => { wakeLock = null; });
      }
      window.speechSynthesis.cancel();
    }

    function formatTime(sec) {
      const s = sec < 10 ? '0' + sec : sec;
      return `00:${s}`;
    }

    function runAutoCycle() {
      if (!isAutoPlaying) return;

      const timerEl = document.getElementById('cardTimer');
      timerEl.style.display = "none";

      // 1. Speak sentence aloud
      speakCurrent(() => {
        if (!isAutoPlaying) return;

        // 2. Start tiny countdown
        let remaining = BREAK_DURATION;
        timerEl.style.display = "inline-block";
        timerEl.innerText = formatTime(remaining);

        countdownInterval = setInterval(() => {
          if (!isAutoPlaying) {
            clearInterval(countdownInterval);
            return;
          }
          remaining--;
          if (remaining >= 0) {
            timerEl.innerText = formatTime(remaining);
          } else {
            clearInterval(countdownInterval);
          }
        }, 1000);

        // 3. Trigger next sentence after 30 seconds
        autoTimer = setTimeout(() => {
          if (!isAutoPlaying) return;

          const hasNext = goNext();
          if (hasNext) {
            runAutoCycle();
          } else {
            stopAutoPlay();
            alert("Completed all sentences for today!");
          }
        }, BREAK_DURATION * 1000);
      });
    }

    // Touch Swiping Left/Right
    let touchStartX = 0, touchEndX = 0;
    const card = document.getElementById('cardArea');
    card.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
    card.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      const diff = touchEndX - touchStartX;
      if (diff < -50) handleManualNext();
      if (diff > 50) handleManualPrev();
    }, { passive: true });

    // Offline CSV Parser
    function handleFileImport(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        parseCSV(evt.target.result);
      };
      reader.readAsText(file);
    }

    function parseCSV(text) {
      const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
      if (lines.length <= 1) return;

      const extracted = [];
      for (let i = 1; i < lines.length; i++) {
        const line = lines[i];
        const r = line.includes('\t') ? line.split('\t') : parseCSVLine(line);
        if (!r || r.length < 3) continue;

        const dayVal = r[0] ? String(r[0]).trim() : "Day 1";
        const verbVal = r[2] ? String(r[2]).trim() : "";
        const sentenceVal = r[5] ? String(r[5]).trim() : (r[4] || "");

        if (sentenceVal) {
          extracted.push({
            day: dayVal.toLowerCase().startsWith('day') ? dayVal : `Day ${dayVal}`,
            no: r[1] ? Number(r[1]) : i,
            verb: verbVal,
            stage: r[3] ? String(r[3]).trim() : "",
            formula: r[4] ? String(r[4]).trim() : "",
            sentence: sentenceVal.replace(/^"|"$/g, ''),
            type: r[6] ? String(r[6]).trim() : "Casual"
          });
        }
      }

      if (extracted.length > 0) {
        masterData = extracted;
        localStorage.setItem('user_matrix_drill_data', JSON.stringify(masterData));
        alert(`Loaded ${extracted.length} sentences successfully!`);
        const day = document.getElementById('daySelect').value;
        loadDay(day);
      }
    }

    function parseCSVLine(text) {
      const p = [];
      let cur = '', inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') { inQuotes = !inQuotes; }
        else if (c === ',' && !inQuotes) { p.push(cur); cur = ''; }
        else { cur += c; }
      }
      p.push(cur);
      return p;
    }

    if (masterData.length > 0) {
      const lastDay = localStorage.getItem('last_day') || "Day 1";
      document.getElementById('daySelect').value = lastDay;
      loadDay(lastDay);
    }
  </script>
</body>
</html>
