<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b1120" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Action Matrix Spoken Drill</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background: #0b1120;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Top Navigation Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #131d31;
      border-bottom: 1px solid #1e293b;
    }
    .select-wrapper { position: relative; }
    .day-selector {
      appearance: none;
      -webkit-appearance: none;
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      padding: 9px 32px 9px 12px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      outline: none;
    }
    .arrow-icon {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #38bdf8;
      font-size: 10px;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Editable Counter Box */
    .counter-pill {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 5px 10px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .counter-input {
      background: #0b1120;
      color: #38bdf8;
      border: 1px solid #475569;
      border-radius: 6px;
      width: 48px;
      height: 28px;
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      outline: none;
      user-select: text;
    }
    .counter-input:focus {
      border-color: #38bdf8;
    }
    /* Hide spin arrows in number input */
    .counter-input::-webkit-outer-spin-button,
    .counter-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .btn-import {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Verb Header */
    .verb-section {
      padding: 14px 20px 0 20px;
      text-align: center;
    }
    .verb-badge {
      display: inline-block;
      background: #0284c7;
      color: #ffffff;
      padding: 7px 22px;
      border-radius: 20px;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
    }
    .verb-subtext {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
    }

    /* Large Center Sentence */
    .center-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      text-align: center;
    }
    .sentence-card {
      background: #131d31;
      border: 1px solid #1e293b;
      padding: 30px 20px;
      border-radius: 22px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
      width: 100%;
      max-width: 600px;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sentence-text {
      font-size: 26px;
      line-height: 1.5;
      font-weight: 700;
      color: #ffffff;
      word-break: break-word;
    }

    /* Bottom 3 Controls */
    .bottom-bar {
      display: flex;
      gap: 12px;
      padding: 14px 16px 20px 16px;
      background: #131d31;
      border-top: 1px solid #1e293b;
    }
    .ctrl-btn {
      flex: 1;
      height: 56px;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.1s ease;
    }
    .ctrl-btn:active {
      transform: scale(0.95);
      opacity: 0.9;
    }
    .btn-prev {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .btn-play {
      background: #10b981;
      color: #ffffff;
      font-size: 18px;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.35);
    }
    .btn-next {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(2, 132, 199, 0.35);
    }
    #fileInput { display: none; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="select-wrapper">
      <select id="daySelect" class="day-selector" onchange="onDayChange()">
        <option value="Day 1">Day 1</option>
        <option value="Day 2">Day 2</option>
        <option value="Day 3">Day 3</option>
        <option value="Day 4">Day 4</option>
        <option value="Day 5">Day 5</option>
      </select>
      <span class="arrow-icon">▼</span>
    </div>

    <div class="top-actions">
      <!-- Directly Editable Number -->
      <div class="counter-pill">
        <input 
          type="number" 
          id="numInput" 
          class="counter-input" 
          min="1" 
          value="1" 
          onchange="jumpTo(this.value)"
          onkeydown="if(event.key==='Enter') this.blur();"
        />
        <span>/ <span id="totalBox">230</span></span>
      </div>
      <button class="btn-import" onclick="document.getElementById('fileInput').click()">📁 CSV</button>
      <input type="file" id="fileInput" accept=".csv,.tsv,.txt" onchange="handleFileImport(event)" />
    </div>
  </div>

  <!-- Verb Details -->
  <div class="verb-section">
    <div class="verb-badge" id="verbBox">ACTION</div>
    <div class="verb-subtext" id="metaBox">Tap '📁 CSV' to load exported sheet</div>
  </div>

  <!-- Big Central Sentence Display (Column F) -->
  <div class="center-stage">
    <div class="sentence-card" id="cardArea">
      <div class="sentence-text" id="sentenceBox">
        "Tap the '📁 CSV' button to load your exported sheet file."
      </div>
    </div>
  </div>

  <!-- Bottom 3 Buttons -->
  <div class="bottom-bar">
    <button class="ctrl-btn btn-prev" onclick="goPrev()">◄ Prev</button>
    <button class="ctrl-btn btn-play" onclick="speakCurrent()">▶ Play</button>
    <button class="ctrl-btn btn-next" onclick="goNext()">Next ►</button>
  </div>

  <script>
    let masterData = [];

    // Load saved database from phone's offline localStorage
    try {
      const saved = localStorage.getItem('user_matrix_drill_data');
      if (saved) {
        masterData = JSON.parse(saved);
      }
    } catch(e) {}

    let activeList = [];
    let curIndex = 0;

    function loadDay(dayName) {
      if (!masterData || masterData.length === 0) return;

      activeList = masterData.filter(item => item.day.toLowerCase().trim() === dayName.toLowerCase().trim());
      if (activeList.length === 0) {
        activeList = masterData.filter(item => item.day.includes(dayName.replace('Day ', '').trim()));
      }

      const savedIdx = localStorage.getItem('last_index_' + dayName);
      if (savedIdx !== null && Number(savedIdx) < activeList.length) {
        curIndex = Number(savedIdx);
      } else {
        curIndex = 0;
      }
      render();
    }

    function render() {
      if (activeList.length === 0) return;
      const item = activeList[curIndex];

      document.getElementById('verbBox').innerText = item.verb || "VERB";
      document.getElementById('metaBox').innerText = `${item.stage || ''} ${item.type ? '• [' + item.type + ']' : ''}`;
      document.getElementById('sentenceBox').innerText = `"${item.sentence}"`;

      // Update editable input box and total
      const inputEl = document.getElementById('numInput');
      inputEl.value = curIndex + 1;
      inputEl.max = activeList.length;
      document.getElementById('totalBox').innerText = activeList.length;

      // Save position
      const day = document.getElementById('daySelect').value;
      localStorage.setItem('last_index_' + day, curIndex);
      localStorage.setItem('last_day', day);
    }

    // Direct Jump Logic
    function jumpTo(val) {
      let target = parseInt(val, 10);
      if (isNaN(target)) target = 1;
      if (target < 1) target = 1;
      if (target > activeList.length) target = activeList.length;
      curIndex = target - 1;
      render();
    }

    function goNext() {
      if (curIndex < activeList.length - 1) {
        curIndex++;
        render();
      }
    }

    function goPrev() {
      if (curIndex > 0) {
        curIndex--;
        render();
      }
    }

    function onDayChange() {
      const sel = document.getElementById('daySelect').value;
      loadDay(sel);
    }

    function speakCurrent() {
      if (!('speechSynthesis' in window)) {
        alert("Text-to-speech not supported on this browser.");
        return;
      }
      if (activeList.length === 0) return;

      window.speechSynthesis.cancel();
      const item = activeList[curIndex];
      const utter = new SpeechSynthesisUtterance(item.sentence);
      utter.lang = 'en-US';
      utter.rate = 0.92; // Natural conversational pacing
      utter.pitch = 1.0;
      window.speechSynthesis.speak(utter);
    }

    // Touch Swiping Left/Right
    let touchStartX = 0, touchEndX = 0;
    const card = document.getElementById('cardArea');
    card.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
    card.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      const diff = touchEndX - touchStartX;
      if (diff < -50) goNext();
      if (diff > 50) goPrev();
    }, { passive: true });

    // 100% Offline CSV Parser (Reads Col A=Day, Col B=No, Col C=Verb, Col F=Sentence)
    function handleFileImport(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        parseCSV(evt.target.result);
      };
      reader.readAsText(file);
    }

    function parseCSV(text) {
      const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
      if (lines.length <= 1) return;

      const extracted = [];
      for (let i = 1; i < lines.length; i++) {
        const line = lines[i];
        // Split by Tab if TSV, else Comma
        const r = line.includes('\t') ? line.split('\t') : parseCSVLine(line);
        if (!r || r.length < 3) continue;

        // Exact Column Layout:
        // Col A (0): Day
        // Col B (1): Item Number
        // Col C (2): Verb
        // Col D (3): Stage
        // Col E (4): Formula
        // Col F (5): Natural_Sentence
        // Col G (6): Context Type

        const dayVal = r[0] ? String(r[0]).trim() : "Day 1";
        const verbVal = r[2] ? String(r[2]).trim() : "";
        const sentenceVal = r[5] ? String(r[5]).trim() : (r[4] || "");

        if (sentenceVal) {
          extracted.push({
            day: dayVal.toLowerCase().startsWith('day') ? dayVal : `Day ${dayVal}`,
            no: r[1] ? Number(r[1]) : i,
            verb: verbVal,
            stage: r[3] ? String(r[3]).trim() : "",
            formula: r[4] ? String(r[4]).trim() : "",
            sentence: sentenceVal.replace(/^"|"$/g, ''),
            type: r[6] ? String(r[6]).trim() : "Casual"
          });
        }
      }

      if (extracted.length > 0) {
        masterData = extracted;
        localStorage.setItem('user_matrix_drill_data', JSON.stringify(masterData));
        alert(`Loaded ${extracted.length} sentences successfully!`);
        const day = document.getElementById('daySelect').value;
        loadDay(day);
      }
    }

    // Handles quoted commas in CSV rows
    function parseCSVLine(text) {
      const p = [];
      let cur = '', inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') { inQuotes = !inQuotes; }
        else if (c === ',' && !inQuotes) { p.push(cur); cur = ''; }
        else { cur += c; }
      }
      p.push(cur);
      return p;
    }

    // Startup check
    if (masterData.length > 0) {
      const lastDay = localStorage.getItem('last_day') || "Day 1";
      document.getElementById('daySelect').value = lastDay;
      loadDay(lastDay);
    }
  </script>
</body>
</html>
